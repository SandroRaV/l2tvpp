# Copy of vyos-build/scripts/package-build/vpp/package.toml (current branch,
# see package.toml.vyos-orig) with ONE addition: the l2tvpp plugin is copied
# into src/plugins/ before the VyOS build, so it ends up in the same
# vpp-plugin-core .deb as every other plugin, built against the exact VPP
# commit + VyOS patches the image uses. Keep this file in sync with upstream.

[[packages]]
name = "vyos-vpp-patches"
commit_id = "rolling"
scm_url = "https://github.com/vyos/vyos-vpp-patches"
build_cmd = "/bin/true"
apply_patches = false

[[packages]]
name = "vpp"
commit_id = "stable/2510"
scm_url = "https://github.com/FDio/vpp"
# Skip apply patches by build.py as we use them in build_cmd
apply_patches = false

pre_build_hook = """
mkdir -p ../patches/vpp/
rsync -av ../vyos-vpp-patches/patches/vpp/ ../patches/vpp/
"""

build_cmd = """
# Patches for vpp should applied here
for patch in ../patches/vpp/*.patch; do
    echo "I: build_cmd applying patch $patch..."
    git -c user.email=maintainers@vyos.net -c user.name=vyos am "$patch" || { echo "Failed to apply patch $patch"; exit 1; }
done

# --- l2tvpp addition: in-tree l2tvpp plugin (+ its make-test suite) ---
rm -rf src/plugins/l2tvpp
cp -r /l2tvpp/plugin/l2tvpp src/plugins/l2tvpp
mkdir -p src/plugins/l2tvpp/test
cp /l2tvpp/test/test_l2tvpp.py src/plugins/l2tvpp/test/ 2>/dev/null || true
git add src/plugins/l2tvpp
git -c user.email=dev@l2tvpp -c user.name=l2tvpp commit -q -m "l2tvpp: LNS data plane plugin (l2tvpp)"
# --- end addition ---

make UNATTENDED=yes VPP_ENABLE_SYSTEMD_NOTIFY=ON install-dep
make VPP_EXTRA_CMAKE_ARGS="-DVPP_ENABLE_SYSTEMD_NOTIFY=ON" pkg-deb
cp build-root/*.deb ../
"""

[dependencies]
packages = [
    "llvm"
]
